server:
  port: 8761

spring:
  application:
    name: eureka-server

info:
  app:
    name: Eureka Server
    description: Service discovery registry for the Fitness Microservices Platform
    deployment: kubernetes-ready

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
